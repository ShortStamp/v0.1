services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shortstamp
      POSTGRES_USER: shortstamp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shortstampdev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortstamp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://shortstamp:${POSTGRES_PASSWORD:-shortstampdev}@db/shortstamp
      ENABLE_SCHEDULER: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  ingestion:
    build: ./ingestion
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://shortstamp:${POSTGRES_PASSWORD:-shortstampdev}@db/shortstamp
    env_file:
      - .env
    volumes:
      - ./backend:/backend

volumes:
  pgdata:
