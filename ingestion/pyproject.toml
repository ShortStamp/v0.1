[project]
name = "shortstamp-ingestion"
version = "0.1.0"
description = "ShortStamp Makeup ingestion microservice"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "curl-cffi>=0.7",
    "apscheduler>=3.10",
    "pydantic-settings>=2.0",
    "tenacity>=8.2",
    "python-dotenv",
    "httpx>=0.27",
    "bcrypt",
    "langchain-google-genai>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ingestion*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
